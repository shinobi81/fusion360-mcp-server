---
extends: default

rules:
  # Actions are pinned to full commit SHAs for supply-chain reasons:
  #   - uses: owner/action@<40 hex>
  # That line cannot fit in 80 columns. 120 keeps normal style pressure
  # without fighting the pinning policy.
  line-length:
    max: 120
    allow-non-breakable-words: true

  # `on:` is GitHub Actions' trigger key, not a YAML boolean.
  truthy:
    allowed-values: ["true", "false", "on"]
