[project]
name = "fusion360-mcp-server"
version = "0.4.1"
description = "MCP server for Autodesk Fusion 360 — bridges AI coding agents to the add-in"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["fusion360", "autodesk", "cad", "mcp", "model-context-protocol", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Andrea Camillacci" }]
dependencies = [
    # Floors are the first patched releases for known advisories: a tag
    # install resolves from these, not from uv.lock.
    "anyio>=4.14.2",
    "click>=8.1",
    "mcp>=1.27.2,<2",
]

[project.urls]
Homepage = "https://github.com/shinobi81/fusion360-mcp-server"
Repository = "https://github.com/shinobi81/fusion360-mcp-server"
Issues = "https://github.com/shinobi81/fusion360-mcp-server/issues"
Upstream = "https://github.com/faust-machines/fusion360-mcp-server"

[project.scripts]
fusion360-mcp-server = "fusion360_mcp:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is measured on every run so a regression is visible in the diff, and
# floored just under the current number rather than at a round figure.  95 leaves
# about 13 statements of slack, which covers the permanent gaps below and any one
# deliberate dead branch; 97 would leave one, and redden five CI jobs at once.
# This lives in addopts, so run a subset with `--no-cov` (see AGENTS.md): the
# floor is about the whole suite, not one file.
#
# Permanently uncovered, by design: `server.py` line 91 (`bbox_before` is never set
# by a mock), line 444 (the unreachable prompt fallback), 493-494 (`app.run` inside
# main()'s stdio coroutine), and `__main__.py`'s click entry point.  Adding
# `addon/` to `source` — the last step of the test refactor — will drop the total
# and needs this floor re-based.
addopts = "--cov --cov-report=term-missing --cov-fail-under=95"

# The add-in imports Fusion's `adsk` runtime, which exists only inside Fusion.
# No static type checker can resolve it, and each unresolved import cascades into
# dozens of false attribute/argument errors, so the add-on is excluded from type
# checking (ruff and the test suite still cover it — see the CI workflow).
[tool.pyright]
exclude = ["addon", "build"]
# Resolve imports from the project venv, otherwise third-party packages read
# as unresolved no matter what is installed.
venvPath = "."
venv = ".venv"

[tool.mypy]
exclude = ["^addon/", "^build/"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[tool.coverage.run]
source = ["src/fusion360_mcp"]

[tool.coverage.report]
omit = ["*/tests/*"]
show_missing = true
