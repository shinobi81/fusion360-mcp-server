[project]
name = "fusion360-mcp-server"
version = "0.7.1"
description = "MCP server for Autodesk Fusion 360 — bridges AI coding agents to the add-in"
readme = "README.md"
requires-python = ">=3.14"
keywords = ["fusion360", "autodesk", "cad", "mcp", "model-context-protocol", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Andrea Camillacci" }]
dependencies = [
    # Floors are the first patched releases for known advisories: a tag
    # install resolves from these, not from uv.lock.
    "anyio>=4.14.2",
    "click>=8.1",
    "mcp>=1.27.2,<2",
]

[project.urls]
Homepage = "https://github.com/shinobi81/fusion360-mcp-server"
Repository = "https://github.com/shinobi81/fusion360-mcp-server"
Issues = "https://github.com/shinobi81/fusion360-mcp-server/issues"
Upstream = "https://github.com/faust-machines/fusion360-mcp-server"

[project.scripts]
fusion360-mcp-server = "fusion360_mcp:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
# No `target-version`: ruff infers it from `project.requires-python` above, so the
# support window is stated once.  A second copy is a copy that drifts — the floor
# said 3.10 for four years after 3.10 was EOL.

[tool.ruff.lint]
select = ["E", "F", "I", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is measured on every run so a regression is visible in the diff, and floored
# just under the current number rather than at a round figure.  The measured total is
# 59.90% over both packages, so the floor is 59: about 30 statements of slack, which
# covers the permanent gaps below and any one deliberate dead branch.
#
# That total is dominated by the add-in: `addon/server` is 2566 statements at ~49%,
# because CAM, export, view-sheet and viewport-render only run inside Fusion.  The add-in's
# own floor is therefore low on purpose, and the server keeps its own gate - CI runs
# `coverage report --include="src/fusion360_mcp/*" --fail-under=95` after pytest - so an
# add-in regression cannot buy slack for `src/`.
#
# This lives in addopts, so run a subset with `--no-cov` (see AGENTS.md): the floor is
# about the whole suite, not one file.
#
# Permanently uncovered, by design: `server.py` line 91 (`bbox_before` is never set
# by a mock), line 444 (the unreachable prompt fallback), 493-494 (`app.run` inside
# main()'s stdio coroutine), and `__main__.py`'s click entry point.
addopts = "--cov --cov-report=term-missing --cov-fail-under=59"

# The add-in imports Fusion's `adsk` runtime, which exists only inside Fusion.
# No static type checker can resolve it, and each unresolved import cascades into
# dozens of false attribute/argument errors, so the add-on is excluded from type
# checking (ruff and the test suite still cover it — see the CI workflow).
#
# This is pyright's **only** configuration.  A `pyrightconfig.json` would silently
# take precedence over this block, which is how `pythonVersion` came to say 3.10
# while the rest of the project had moved on; `tests/test_packaging.py` now fails
# if one reappears.  `.venv` and `node_modules` are excluded because they are
# installed trees rather than source, and `typeCheckingMode` is pinned so the
# checked set cannot change by omission.
[tool.pyright]
exclude = ["addon", "build", ".venv", "node_modules"]
typeCheckingMode = "basic"
# Resolve imports from the project venv, otherwise third-party packages read
# as unresolved no matter what is installed.
venvPath = "."
venv = ".venv"
# The support window, restated because pyright cannot infer it from
# `requires-python`.  It must equal the floor exactly: lower reports errors on
# supported code, higher accepts syntax we do not support.
pythonVersion = "3.14"

[tool.mypy]
exclude = ["^addon/", "^build/"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]
# Not in `dev`: `ci.yml` syncs `--dev` on three platforms, and atheris publishes
# no Windows wheel — the marker keeps the group empty off Linux, so asking for it
# on a workstation cannot fail the sync.  The marker's floor is now the window
# itself, not decoration: uv locks every version in `requires-python`, atheris
# 3.1.0's newest wheel is cp314, so inside a >=3.14 window the lock narrows to
# that one wheel.  On 3.15 atheris publishes neither a wheel nor an sdist while
# the marker above still asks for it, so a sync at 3.15 FAILS LOUDLY at resolve
# time — which is the behaviour you want.  It is not a silent no-op, and the
# group is only "empty" on non-Linux platforms, where the marker's
# `sys_platform == 'linux'` half excludes it.  Sync it with
# `uv sync --only-group fuzz --python 3.14`, or a target stops at
# `import atheris` with nothing to say why.  Do not hardcode a `< 3.15` cap: it
# goes stale the day a cp315 wheel lands.
fuzz = [
    "atheris==3.1.0; sys_platform == 'linux' and python_full_version >= '3.12'",
]

[tool.coverage.run]
source = ["src/fusion360_mcp", "addon/server"]

[tool.coverage.report]
omit = ["*/tests/*"]
show_missing = true
