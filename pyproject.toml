[project]
name = "fusion360-mcp-server"
version = "0.8.4"
description = "MCP server for Autodesk Fusion 360 — bridges AI coding agents to the add-in"
readme = "README.md"
requires-python = ">=3.14"
keywords = ["fusion360", "autodesk", "cad", "mcp", "model-context-protocol", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Andrea Camillacci" }]
dependencies = [
    # Floors are the first patched releases for known advisories: a tag
    # install resolves from these, not from uv.lock.
    "anyio>=4.14.2",
    "click>=8.1",
    "mcp>=1.27.2,<2",
]

[project.urls]
Homepage = "https://github.com/shinobi81/fusion360-mcp-server"
Repository = "https://github.com/shinobi81/fusion360-mcp-server"
Issues = "https://github.com/shinobi81/fusion360-mcp-server/issues"
Upstream = "https://github.com/faust-machines/fusion360-mcp-server"

[project.scripts]
fusion360-mcp-server = "fusion360_mcp:main"

[tool.setuptools]
# `addon/` is outside `src/`, so these mappings are what put it into the wheel; a new
# package under `src/` must be listed in `packages` (a test fails when one is not).
package-dir = { "" = "src", "fusion360_mcp.addon" = "addon", "fusion360_mcp.addon.server" = "addon/server" }
packages = ["fusion360_mcp", "fusion360_mcp.addon", "fusion360_mcp.addon.server"]

[tool.setuptools.package-data]
# Only the manifest is data by suffix; the `.py` files are copied as package modules.
"fusion360_mcp.addon" = ["*.manifest"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
# No `target-version`: ruff infers it from `project.requires-python`, so the support
# window is stated once and cannot drift from it.

[tool.ruff.lint]
select = ["E", "F", "I", "RUF", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Floored just under the measured combined total: the number is printed by the test job,
# never written down here.  A subset run needs `--no-cov`.
addopts = "--cov --cov-report=term-missing --cov-fail-under=59"

# The add-in imports Fusion's `adsk`, which no static type checker can resolve, so
# `addon/` is excluded (ruff and the suite still cover it).  This block is pyright's only
# configuration: a `pyrightconfig.json` would take precedence, and a test fails on one.
[tool.pyright]
exclude = ["addon", "build", ".venv", "node_modules"]
typeCheckingMode = "basic"  # pinned: the checked set cannot change by omission
# Resolve imports from the project venv, otherwise third-party packages read
# as unresolved no matter what is installed.
venvPath = "."
venv = ".venv"
# The support window, restated because pyright cannot infer it from `requires-python`.
# It must equal the floor exactly: lower reports errors on supported code, higher accepts
# syntax we do not support.
pythonVersion = "3.14"

# Run by `uv run mypy src` in the `test` CI job: a checker nothing invokes reports
# nothing.  `src/` only — `addon/` reaches Fusion's `adsk`, which no checker can
# resolve, and the suite covers it instead.  `check_untyped_defs` is left off, so a
# body with no annotations is not analysed: "0 errors" is a floor, not a claim about
# those bodies.
[tool.mypy]
exclude = ["^addon/", "^build/"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=2.4.1",
]
# Not in `dev`: atheris publishes no Windows wheel and `ci.yml` syncs `--dev` on three
# platforms, so the marker keeps the group empty off Linux.  Sync it with
# `uv sync --locked --only-group fuzz --python 3.14`; no upper cap, so a cp315 wheel works.
fuzz = [
    "atheris==3.1.0; sys_platform == 'linux' and python_full_version >= '3.12'",
]

[tool.coverage.run]
source = ["src/fusion360_mcp", "addon/server"]

[tool.coverage.report]
omit = ["*/tests/*"]
show_missing = true
