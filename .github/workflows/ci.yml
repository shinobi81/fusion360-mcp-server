---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read  # least privilege; no job here needs to write

concurrency:
  # github.ref is refs/pull/<n>/merge on PRs, so this still cancels per PR.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check names are contractual: the ruleset on `main` (id 26326994) requires
  # `test (3.14)` and `test (3.15)`.  GitHub builds that context as
  # `<job name> (<matrix value>)`, so renaming this job or changing a matrix
  # entry leaves behind a required check that never reports.  Every PR then sits
  # at "Expected — Waiting for status to be reported" forever, and the pressure
  # to bypass it with `gh pr merge --admin` is how an unprotected merge happens.
  # The matrix and the ruleset must move together.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]

    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved, a SHA
      # cannot. The version each SHA corresponds to is on the line above.
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # astral-sh/setup-uv v10.3.3 — no floating major exists past v7, so this
      # must name an exact release.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --frozen --python ${{ matrix.python-version }}

      # Both halves of the lint gate belong here.  `ruff check` alone left four
      # test files unformatted on `main` across two changes: nothing ran the
      # formatter, so the drift was invisible until someone typed `ruff format`
      # by hand.
      #
      # `addon/` is deliberately missing from the formatter line (it is still
      # linted).  The add-in runs on Fusion's own interpreter, which
      # `requires-python` does not govern, so a rewrite that is legal for this
      # package is not safe to apply there.  The sole drift ruff reports in the
      # directory is exactly such a rewrite: the 3.14-only unparenthesised
      # `except` tuple.
      - name: Lint
        run: |
          uv run ruff check src/ tests/ fuzz/ addon/ scripts/
          uv run ruff format --check src/ tests/ fuzz/ scripts/

      - name: Test
        run: uv run pytest -v

      # The combined floor in addopts is dominated by the add-in's live-only branches (CAM,
      # export, viewport render).  This keeps the server's own floor where it was, so an
      # add-in regression cannot buy slack for src/.
      - name: src coverage floor
        run: uv run coverage report --include="src/fusion360_mcp/*" --fail-under=95

  # This project has Windows-specific behaviour (loopback resolution, an .exe
  # the running MCP server keeps open), so the suite runs there too.
  windows:
    runs-on: windows-latest

    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      # Pinned rather than left to the runner image: `requires-python` is >=3.14,
      # and an image that ships something older turns this job into a silent
      # download-or-fail.  This OS tests the newest stable, by name.
      - name: Install Python 3.15
        run: uv python install 3.15

      - name: Install dependencies
        run: uv sync --dev --frozen --python 3.15

      - name: Test
        run: uv run pytest -q

  # The add-in install path and devcontainer wrapper are macOS-specific.
  macos:
    runs-on: macos-latest

    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Install Python 3.15
        run: uv python install 3.15

      - name: Install dependencies
        run: uv sync --dev --frozen --python 3.15

      - name: Test
        run: uv run pytest -q

  docs:
    runs-on: ubuntu-latest

    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-node v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1

      # astral-sh/setup-uv v10.3.3 — `uvx yamllint` needs it on PATH
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "#.venv" "#node_modules"

      # .yamllint.yml allows the long lines that SHA-pinned actions force.
      - name: Lint YAML
        run: uvx yamllint -c .yamllint.yml .github/

  # Review threads must be resolved before a PR merges. The branch ruleset
  # already says so (required_review_thread_resolution: true), but the code
  # owner holds bypass_mode: pull_request and `gh pr merge --admin` bypasses
  # the whole ruleset — which is how PR #19 merged with seven open CodeQL
  # findings. This job is the copy that shows up in the checks list, where a
  # human or an agent actually looks before bypassing anything.
  threads:
    runs-on: ubuntu-latest
    # Only a PR has threads; a push to main has nothing to check.
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: read

    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # gh is preinstalled and authenticated with the job token. A failure to
      # *query* is a failure, not a pass: an unchecked merge is the bug.
      - name: No unresolved review threads
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/check_review_threads.py
          "${{ github.event.pull_request.number }}"
