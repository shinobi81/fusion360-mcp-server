---
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly disclosed pattern in unchanged code is still caught.
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # github/codeql-action v3. Python is interpreted, so there is no build
      # step to intercept: init then analyze is the whole pipeline.
      # The suppression covers only line-length, which SHA pinning forces.
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8  # yamllint disable-line rule:line-length
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8  # yamllint disable-line rule:line-length
