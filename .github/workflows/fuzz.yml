---
name: fuzz

# Not a required status check and not named in any ruleset: a target that finds
# something on an unrelated PR must not be able to block that PR's merge. It
# reports, which is the point; it gates, which it must not.
on:
  pull_request:
    branches: [main]
    paths: ["addon/server/**", "fuzz/**", ".github/workflows/fuzz.yml"]
  schedule:
    # Weekly. A fuzzer earns its keep on the inputs nobody thought to write.
    - cron: "13 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved, a SHA
      # cannot. The version each SHA corresponds to is on the line above.
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      # The `fuzz` group floors itself at 3.12 (atheris 3.1.0 ships cp312,
      # cp313 and cp314 wheels only), so install that interpreter explicitly
      # rather than depend on whatever ubuntu-latest currently defaults to.
      - name: Set up Python 3.12
        run: uv python install 3.12

      # `--only-group fuzz` installs atheris and nothing else — the project and
      # the `dev` group are both skipped. That is sound here because every
      # target imports the standard library plus `addon.server`, nothing more.
      - name: Install the fuzz group
        run: uv sync --frozen --only-group fuzz --python 3.12

      # No PYTHONOPTIMIZE in this job, ever. The targets' invariants are bare
      # `assert`s, and `-O` compiles them out — a fuzzer that reports clean
      # because it checks nothing is worse than no fuzzer at all.
      #
      # `-m`, not `python fuzz/<target>.py`: the targets import their shared
      # plumbing package-relatively (`from ._common import …`), which only works
      # in module mode, and module mode also puts the repo root on `sys.path` so
      # `from addon.server…` resolves.
      #
      # `addon/server/__init__.py` opens `~/fusion360mcp.log` at import, so the
      # runner needs a writable `$HOME`. GitHub's ubuntu runners have one; a
      # locked-down container would fail each target at import, before a single
      # input runs.
      - name: Fuzz classify()
        run: uv run --no-sync python -m fuzz.fuzz_hints_classify -max_total_time=60 -rss_limit_mb=2048

      - name: Fuzz parameter_units
        run: uv run --no-sync python -m fuzz.fuzz_parameter_units -max_total_time=60 -rss_limit_mb=2048

      - name: Fuzz hole_geometry
        run: uv run --no-sync python -m fuzz.fuzz_hole_geometry -max_total_time=60 -rss_limit_mb=2048

      # 30s, not 60: every iteration allocates a socket pair and a thread.
      - name: Fuzz socket framing
        run: uv run --no-sync python -m fuzz.fuzz_socket_framing -max_total_time=30 -rss_limit_mb=2048
