---
name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/dependency-review-action v4 — fails the PR if it introduces a
      # dependency with a known advisory, including transitive ones.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # yamllint disable-line rule:line-length
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
