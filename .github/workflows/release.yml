---
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # create the release and upload assets
      id-token: write  # required for build provenance attestation
      attestations: write  # required for build provenance attestation

    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Build wheel and sdist
        run: uv build

      # The wheel is how a tag install reaches Fusion: `--install-addon` copies the
      # add-in out of it.  A build that loses `addon/` still publishes, and nothing
      # outside a manual run would notice, so the check runs before the release.
      - name: Check the artifacts ship the add-in
        run: uv run --no-project python scripts/check_artifacts_ship_addon.py dist

      # Scorecard's SBOM check looks for an SBOM among the release assets, so it
      # is generated from the exact dependency set the wheel resolves.
      - name: Generate SBOM (CycloneDX)
        run: |
          uv export --no-hashes --format requirements-txt -o /tmp/req.txt
          grep -v '^fusion360-mcp-server' /tmp/req.txt > /tmp/req-audited.txt || true
          uvx --from cyclonedx-bom cyclonedx-py requirements /tmp/req-audited.txt \
            --output-format JSON -o dist/sbom.cdx.json

      # SLSA-style provenance for the wheel and sdist: proves they were built
      # by this workflow from this commit, not uploaded by hand.
      # actions/attest-build-provenance v4.2.2
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        id: attest
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      # Scorecard's Signed-Releases check reads release asset *names* only: its
      # releasesAreSigned probe looks for .asc/.minisig/.sig/.sign/.sigstore/
      # .sigstore.json. The bundle the step above writes is a sigstore bundle, so it
      # ships under that name and the release counts as signed.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "${BUNDLE_PATH:?bundle-path output was empty}" dist/provenance.sigstore.json
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl dist/*.tar.gz dist/sbom.cdx.json dist/provenance.sigstore.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      - name: Summarise
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
